<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css Line Icons</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h2>
      <small> MORPHING : MINIMAL : CSSiCONS </small>
      Hover Morphing CSS Line Icons
    </h2>

    <hr />

    <a class="cssicon minus" data-morph="minus plus" href="#">
      <span> </span>
    </a>
    <a class="cssicon plus" data-morph="plus close" href="#">
      <span></span>
    </a>
    <a class="cssicon hamburger" data-morph="hamburger close" href="#">
      <span></span>
    </a>
    <a class="cssicon close" data-morph="close right" href="#">
      <span></span>
    </a>
    <a class="cssicon down" data-morph="down up" href="#">
      <span></span>
    </a>
    <a class="cssicon up" data-morph="up down" href="#">
      <span></span>
    </a>
    <a class="cssicon right" data-morph="right left" href="#">
      <span></span>
    </a>
    <a class="cssicon left" data-morph="left right" href="#">
      <span></span>
    </a>
    <a class="cssicon search" data-morph="search close" href="#">
      <span></span>
    </a>
    <div class="links">
      <a id="link-1" class="link" href="https://wsss.tistory.com/453">
        Web's tistory
      </a>
      <a id="link-2" class="link" href="https://codepen.io/asraven/pen/obEJZR">
        codepen
      </a>
    </div>
  </body>
</html>
