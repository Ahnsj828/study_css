<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>부트스트랩 예제</title>

    <!-- 부트스트랩 CSS 불러오기 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark">
    <div class="container py-5">
      <h1 class="text-center mb-4 text-white">🎉 부트스트랩 시작하기</h1>

      <!-- 버튼 예제 -->
      <div class="text-center mb-4">
        <button class="btn btn-primary">기본 버튼</button>
        <button class="btn btn-success">성공 버튼</button>
        <button class="btn btn-outline-danger">테두리 버튼</button>
      </div>

      <!-- 카드 예제 -->
      <div class="card mx-auto" style="width: 18rem">
        <img
          src="https://placehold.co/600x400/transparent/F00"
          class="card-img-top"
          alt="샘플 이미지"
        />
        <img
          src="https://placehold.co/600x400/orange/white"
          class="card-img-second"
          alt="샘플이미지2"
        />

        <div class="card-body">
          <h5 class="card-title">카드 제목</h5>
          <p class="card-text">
            부트스트랩은 반응형 UI를 빠르게 만들 수 있는 프레임워크입니다.
          </p>
          <a href="#" class="btn btn-primary">자세히 보기</a>
        </div>
      </div>
    </div>

    <!-- 부트스트랩 JS 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
